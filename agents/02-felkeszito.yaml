# Szerepkör-specifikáció (koncepció, még nem futtatható)
nev: "Sajtófelkészítő Ügynök"
munkanev: "Briefing Agent"
bevezetesi_szakasz: 2
szerep: "A vezetők és szóvivők tartalmi és kommunikációs felkészítése."
bemenetek:
  - "téma vagy esemény"
  - "Monitoring: aktuális narratívák"
  - "Archívum: korábbi nyilatkozatok"
  - "Proaktív stratégia: üzenetjavaslat"
kimenetek:
  - "háttéranyag: tények, adatok, idővonal, érintettek, korábbi nyilatkozatok"
  - "Q&A lista: legvalószínűbb, legkellemetlenebb, legstratégiaibb kérdések"
  - "üzenetkeretek: fő üzenet, másodlagos üzenet, kerülendő"
  - "red flags lista"
  - "1–2 oldalas talking points"
eszkalacio_a_vezetohoz:
  - "red flag témák: vezető vagy jogász bevonása azonnal"
jovahagyas: "Az anyag belső használatra készül; külső felhasználás előtt a vezető átnézi."
naplozas: "Minden javaslat és a vezető döntése naplóba kerül (audit és tanulás)."
