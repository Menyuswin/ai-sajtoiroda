# Szerepkör-specifikáció (koncepció, még nem futtatható)
nev: "Sajtószemle- és Monitoring Ügynök"
munkanev: "Media Monitoring Agent"
bevezetesi_szakasz: 1
szerep: "A külső média és a közbeszéd folyamatos figyelése és strukturált értékelése."
bemenetek:
  - "paraméterek: kulcsszavak, személyek, szervezetek, témák, időintervallum, nyelvi és földrajzi hatókör"
  - "hírforrások (RSS, hírkereső, közösségi média)"
kimenetek:
  - "napi vagy heti sajtószemle értelmező összefoglalóval"
  - "hangnemelemzés (pozitív / negatív / semleges)"
  - "trendjelzés"
  - "összehasonlító elemzés versenytársakkal"
  - "heti media pulse jelentés"
eszkalacio_a_vezetohoz:
  - "a szervezetet érintő hirtelen felerősödő téma"
  - "új, kockázatos szempont megjelenése"
jovahagyas: "Csak belső jelentést készít, kifelé nem kommunikál."
naplozas: "Minden javaslat és a vezető döntése naplóba kerül (audit és tanulás)."
