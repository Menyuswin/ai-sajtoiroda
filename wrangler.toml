# Cloudflare Worker beállítás. NINCS telepítve: a telepítés a tulajdonos Cloudflare-fiókjában, az ő jóváhagyásával történik.
name = "ai-sajtoiroda"
main = "src/worker/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Saját aldomén (a manyai.hu DNS-e ugyanebben a Cloudflare-fiókban van).
routes = [{ pattern = "iroda.manyai.hu", custom_domain = true }]

# Óránként, a 30. percben (a szemle-időpontot a profil dönti el, időzónával).
# A felület fájljait a telepítés előtt egy modulba csomagolja.
[build]
command = "node scripts/build-ui.mjs"

[triggers]
# A Gmail/Exchange postafiókot ez az ütemezés kérdezi le; sürgős megkeresésekhez sűrítse (pl. "*/15 * * * *"). A levélhíd (iCloud) levelei azonnal beérkeznek.
crons = ["30 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "ai-sajtoiroda"
database_id = "f786bddf-1389-4646-b019-860f11917b00"   # a `wrangler d1 create ai-sajtoiroda` adta
migrations_dir = "migrations"

# A dokumentumok eredeti fájljainak tárolása (Cloudflare R2). Amíg az R2 nincs bekapcsolva a fiókban, ez a rész maradjon kikommentezve:
# a rendszer ilyenkor csak a kinyert szöveget tárolja (az eredeti nem tölthető vissza).
# [[r2_buckets]]
# binding = "DOCS"
# bucket_name = "ai-sajtoiroda-dokumentumok"

# A promptok (.md) szövegként épülnek a csomagba.
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

[vars]
SAJTOIRODA_LIVE = "0"    # 1 = éles küldés; amíg nincs levélküldő kiválasztva, ne állítsd át
SAJTOIRODA_DEV_AUTH = "0"  # a próbabelépés kizárólag fejlesztéshez való; élesben mindig 0
ACCESS_TEAM_DOMAIN = ""    # pl. csapatnev.cloudflareaccess.com (Cloudflare Access); üresen az oldal zárva marad
ACCESS_AUD = ""            # az Access-alkalmazás „AUD” azonosítója
SAJTOIRODA_BELEPES_EMAIL = "zoltan.manyai@icloud.com"  # saját belépés (jelmondat): ennek a felhasználónak a szerepe; a jelmondat Workers-titok: wrangler secret put SAJTOIRODA_JELMONDAT (min. 20 karakter)
SAJTOIRODA_LLM = "mock"  # "anthropic" = valódi AI (ANTHROPIC_API_KEY titokként: wrangler secret put ANTHROPIC_API_KEY)
